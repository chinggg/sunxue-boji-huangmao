<svg xmlns="http://www.w3.org/2000/svg" fill="#5A6B85" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="系统架构图">
  <defs>
    <style>
      .t { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
      .h { font-size: 21px; font-weight: 700; }
      .s { font-size: 14px; }
      .k { font-size: 13px; letter-spacing: 1px; }
      .v { font-size: 17px; font-weight: 700; fill: #16233A; }
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
    <marker id="aru" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#FFFFFF"/>

  <!-- Layer 0: output -->
  <rect x="60" y="30" width="860" height="76" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text class="t h" x="490" y="62" fill="#3730A3" text-anchor="middle">应用层 · 你的结果</text>
  <text class="t s" x="490" y="88" fill="#4F46E5" text-anchor="middle">财富　·　事业　·　身体　·　认知　·　关系</text>

  <line x1="490" y1="106" x2="490" y2="140" stroke="#2563EB" stroke-width="2" marker-end="url(#aru)"/>

  <!-- Layer 1: daemon -->
  <rect x="60" y="146" width="860" height="86" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>
  <text class="t h" x="490" y="180" fill="#115E59" text-anchor="middle">DAEMON　数据守护进程：本地 Markdown + API 解耦</text>
  <text class="t s" x="490" y="207" fill="#0F766E" text-anchor="middle">数据主权归你　·　模型只是可替换的算力插件　·　不被任何 SaaS 绑定</text>

  <line x1="490" y1="232" x2="490" y2="266" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Layer 2: three components -->
  <!-- 孙学 kernel -->
  <rect x="60" y="272" width="270" height="150" rx="12" fill="#FFFBEB" stroke="#F5C451" stroke-width="2"/>
  <text class="t k" x="195" y="300" fill="#B45309" text-anchor="middle">KERNEL</text>
  <text class="t v" x="195" y="332" text-anchor="middle" font-size="24">孙学</text>
  <text class="t s" x="195" y="360" text-anchor="middle">认知内核</text>
  <line x1="88" y1="376" x2="302" y2="376" stroke="#F5C451" stroke-opacity="0.5"/>
  <text class="t s" x="195" y="396" text-anchor="middle">投入产出比最大化</text>
  <text class="t s" x="195" y="414" text-anchor="middle">他人评价不计入成本</text>

  <!-- 薄肌 -->
  <rect x="355" y="272" width="270" height="150" rx="12" fill="#FEF2F2" stroke="#E2574C" stroke-width="2"/>
  <text class="t k" x="490" y="300" fill="#B91C1C" text-anchor="middle">DRIVER 1</text>
  <text class="t v" x="490" y="332" text-anchor="middle" font-size="24">薄肌</text>
  <text class="t s" x="490" y="360" text-anchor="middle">身体驱动</text>
  <line x1="383" y1="376" x2="597" y2="376" stroke="#E2574C" stroke-opacity="0.5"/>
  <text class="t s" x="490" y="396" text-anchor="middle">低维护 · 高续航 · 随时能跑</text>
  <text class="t s" x="490" y="414" text-anchor="middle">肌肉 = 身体的美金存量</text>

  <!-- 黄毛 -->
  <rect x="650" y="272" width="270" height="150" rx="12" fill="#ECFDF5" stroke="#4CAF7D" stroke-width="2"/>
  <text class="t k" x="785" y="300" fill="#047857" text-anchor="middle">DRIVER 2</text>
  <text class="t v" x="785" y="332" text-anchor="middle" font-size="24">黄毛</text>
  <text class="t s" x="785" y="360" text-anchor="middle">执行驱动</text>
  <line x1="678" y1="376" x2="892" y2="376" stroke="#4CAF7D" stroke-opacity="0.5"/>
  <text class="t s" x="785" y="396" text-anchor="middle">不装 · 不等 · 不解释</text>
  <text class="t s" x="785" y="414" text-anchor="middle">评价成本清零的精神护甲</text>

  <!-- relation note -->
  <line x1="330" y1="347" x2="355" y2="347" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="625" y1="347" x2="650" y2="347" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="t s" x="490" y="452" text-anchor="middle" font-size="15" fill="#334155">孙学是内核，薄肌与黄毛是跑在这个内核上的两个应用</text>

  <!-- barrier -->
  <rect x="60" y="470" width="860" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text class="t s" x="490" y="495" text-anchor="middle" fill="#334155">外部阻力：嘲讽 · 质疑 · 打压 · 嫉妒</text>
  <text class="t s" x="490" y="517" text-anchor="middle" fill="#64748B">↑ 由黄毛护甲吸收　—　当一个人兼具高认知与好体魄时，极易受到质疑</text>

  <!-- footer -->
  <text class="t s" x="490" y="562" text-anchor="middle" fill="#94A3B8" font-size="13">三者不是并列关系，而是一个方法论加两个应用</text>
  <text class="t s" x="490" y="586" text-anchor="middle" fill="#94A3B8" font-size="13">门槛：孙学一本书　·　薄肌每天 30 分钟　·　黄毛愿意就行</text>
</svg>
