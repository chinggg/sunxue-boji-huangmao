<svg xmlns="http://www.w3.org/2000/svg" fill="#5A6B85" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="三体耦合飞轮">
  <defs>
    <style>
      .t { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
      .s { font-size: 14px; }
      .b { font-size: 20px; font-weight: 700; fill: #16233A; }
    </style>
    <marker id="a1" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="720" height="560" fill="#FFFFFF"/>
  <text class="t b" x="360" y="40" text-anchor="middle" fill="#16233A" font-size="22">三体耦合飞轮</text>
  <text class="t s" x="360" y="66" text-anchor="middle">孙学给方向　·　薄肌给燃料　·　黄毛给护甲　·　结果回到孙学校准</text>

  <!-- circle path -->
  <circle cx="360" cy="290" r="168" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- nodes -->
  <!-- 孙学 top -->
  <g>
    <circle cx="360" cy="140" r="62" fill="#FFFBEB" stroke="#F5C451" stroke-width="2"/>
    <text class="t b" x="360" y="134" text-anchor="middle" font-size="24">孙学</text>
    <text class="t s" x="360" y="158" text-anchor="middle" fill="#B45309">给方向</text>
  </g>
  <!-- 薄肌 right -->
  <g>
    <circle cx="528" cy="290" r="62" fill="#FEF2F2" stroke="#E2574C" stroke-width="2"/>
    <text class="t b" x="528" y="284" text-anchor="middle" font-size="24">薄肌</text>
    <text class="t s" x="528" y="308" text-anchor="middle" fill="#B91C1C">给燃料</text>
  </g>
  <!-- 黄毛 bottom -->
  <g>
    <circle cx="360" cy="458" r="62" fill="#ECFDF5" stroke="#4CAF7D" stroke-width="2"/>
    <text class="t b" x="360" y="452" text-anchor="middle" font-size="24">黄毛</text>
    <text class="t s" x="360" y="476" text-anchor="middle" fill="#047857">给护甲</text>
  </g>
  <!-- 结果 left -->
  <g>
    <circle cx="192" cy="290" r="62" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text class="t b" x="192" y="284" text-anchor="middle" font-size="24">结果</text>
    <text class="t s" x="192" y="308" text-anchor="middle" fill="#1D4ED8">可验收</text>
  </g>

  <!-- arrows along circle -->
  <path d="M420 148 A168 168 0 0 1 500 236" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#a1)"/>
  <path d="M500 344 A168 168 0 0 1 420 432" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#a1)"/>
  <path d="M300 432 A168 168 0 0 1 220 344" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#a1)"/>
  <path d="M220 236 A168 168 0 0 1 300 148" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- center daemon -->
  <circle cx="360" cy="290" r="76" fill="#F0FDFA" stroke="#5EBFA8" stroke-width="2"/>
  <text class="t b" x="360" y="276" text-anchor="middle" fill="#115E59" font-size="16">AI 守护进程</text>
  <text class="t s" x="360" y="298" text-anchor="middle" fill="#0F766E" font-size="12">本地 Markdown</text>
  <text class="t s" x="360" y="316" text-anchor="middle" fill="#0F766E" font-size="12">反馈 · Tuning</text>

  <!-- edge labels -->
  <text class="t s" x="500" y="200" text-anchor="middle" fill="#64748B" font-size="12">方向 → 体能</text>
  <text class="t s" x="500" y="392" text-anchor="middle" fill="#64748B" font-size="12">体能 → 执行</text>
  <text class="t s" x="220" y="392" text-anchor="middle" fill="#64748B" font-size="12">执行 → 产出</text>
  <text class="t s" x="220" y="200" text-anchor="middle" fill="#64748B" font-size="12">产出 → 校准</text>

  <!-- formula -->
  <rect x="90" y="524" width="540" height="0" fill="none"/>
  <text class="t s" x="360" y="536" text-anchor="middle" fill="#334155" font-size="15">结果产出 ≈ 孙学 × 薄肌 × 黄毛　—　乘法，任何一项趋近 0，整体趋近 0</text>
</svg>
