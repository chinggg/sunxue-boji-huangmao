<svg xmlns="http://www.w3.org/2000/svg" fill="#5A6B85" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="30天启动路线图">
  <defs>
    <style>
      .t { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
      .s { font-size: 13px; }
      .lbl { font-size: 15px; font-weight: 700; fill: #16233A; }
      .bar { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="900" height="400" fill="#FFFFFF"/>
  <text class="t lbl" x="450" y="38" text-anchor="middle" font-size="22">30 天启动路线图</text>
  <text class="t s" x="450" y="62" text-anchor="middle">先装薄肌（反馈最快）→ 并行装孙学（成本近乎为零）→ 最后上黄毛（阻力最大）</text>

  <!-- chart area: x 208..868 => 660px / 30 days = 22px per day -->
  <!-- milestone（画在进度条下层，避免压住色条） -->
  <line x1="824" y1="88" x2="824" y2="300" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="824" cy="88" r="6" fill="#2563EB"/>

  <g>
    <!-- grid -->
    <g stroke="#EEF2F7" stroke-width="1">
      <line x1="208" y1="88" x2="208" y2="300"/>
      <line x1="318" y1="88" x2="318" y2="300"/>
      <line x1="428" y1="88" x2="428" y2="300"/>
      <line x1="538" y1="88" x2="538" y2="300"/>
      <line x1="648" y1="88" x2="648" y2="300"/>
      <line x1="758" y1="88" x2="758" y2="300"/>
      <line x1="868" y1="88" x2="868" y2="300"/>
    </g>
    <g class="t s" fill="#94A3B8" font-size="11" text-anchor="middle">
      <text x="208" y="82">D1</text>
      <text x="318" y="82">D6</text>
      <text x="428" y="82">D11</text>
      <text x="538" y="82">D16</text>
      <text x="648" y="82">D21</text>
      <text x="758" y="82">D26</text>
      <text x="868" y="82">D30</text>
    </g>

    <!-- rows -->
    <!-- 1 建档 D1-D7 -->
    <text class="t lbl" x="196" y="124" text-anchor="end" font-size="14">建档　数据仓</text>
    <rect x="208" y="106" width="132" height="26" rx="6" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text class="t bar" x="274" y="123" text-anchor="middle" fill="#0369A1">连续 7 天记录</text>

    <!-- 2 薄肌 D1-D30 -->
    <text class="t lbl" x="196" y="164" text-anchor="end" font-size="14">薄肌　身体驱动</text>
    <rect x="208" y="146" width="660" height="26" rx="6" fill="#FEE2E2" stroke="#FCA5A5"/>
    <text class="t bar" x="538" y="163" text-anchor="middle" fill="#B91C1C">每天 30 分钟抗阻复合动作 · 深蹲/硬拉渐进超载</text>

    <!-- 3 孙学 D3-D14 -->
    <text class="t lbl" x="196" y="204" text-anchor="end" font-size="14">孙学　认知内核</text>
    <rect x="252" y="186" width="264" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D"/>
    <text class="t bar" x="384" y="203" text-anchor="middle" fill="#92400E">AI 推演 100 个专业 · 产出 Benchmark 表</text>

    <!-- 4 黄毛 D8-D30 -->
    <text class="t lbl" x="196" y="244" text-anchor="end" font-size="14">黄毛　执行护甲</text>
    <rect x="362" y="226" width="506" height="26" rx="6" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text class="t bar" x="615" y="243" text-anchor="middle" fill="#065F46">做一件「面子过不去但正确」的事 · 情绪成本 → 0</text>

    <!-- 5 复算 D30 -->
    <text class="t lbl" x="196" y="284" text-anchor="end" font-size="14">复算　Tuning</text>
    <rect x="824" y="266" width="44" height="26" rx="6" fill="#3B82F6"/>
    <text class="t bar" x="846" y="283" text-anchor="middle" fill="#FFFFFF" font-size="11">D30</text>
    <text class="t s" x="812" y="284" text-anchor="end" fill="#334155">30 天数据 → 3 个大模型 → 取中策</text>
  </g>

  <!-- baseline -->
  <line x1="208" y1="300" x2="868" y2="300" stroke="#CBD5E1" stroke-width="2"/>

  <!-- milestone label -->
  <text class="t s" x="824" y="320" text-anchor="middle" fill="#2563EB" font-weight="700">首次复算</text>

  <!-- footer notes -->
  <rect x="60" y="340" width="780" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text class="t s" x="450" y="366" text-anchor="middle" fill="#334155" font-size="14">
    顺序原理：薄肌 7–14 天可见反馈（成本最低）→ 孙学 30–90 天（并行）→ 黄毛即时但阻力最高（需先建立系统信用）
  </text>
</svg>
