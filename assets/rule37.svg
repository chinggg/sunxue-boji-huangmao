<svg xmlns="http://www.w3.org/2000/svg" fill="#5A6B85" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="37% 参照系决策模型">
  <defs>
    <style>
      .t { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
      .s { font-size: 14px; }
      .b { font-size: 20px; font-weight: 700; fill: #16233A; }
    </style>
    <linearGradient id="bm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="dz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F6FED"/>
      <stop offset="100%" stop-color="#6EA8FF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" fill="#FFFFFF"/>
  <text class="t b" x="450" y="40" text-anchor="middle" fill="#16233A" font-size="22">37% 参照系决策模型</text>
  <text class="t s" x="450" y="66" text-anchor="middle">面对 100 个选项：前 37% 只建 Benchmark，之后遇超参照系最优解立刻出手</text>

  <!-- track -->
  <rect x="70" y="112" width="740" height="54" rx="8" fill="#E2E8F0"/>
  <rect x="70" y="112" width="274" height="54" rx="8" fill="url(#bm)"/>
  <rect x="344" y="112" width="466" height="54" rx="8" fill="url(#dz)"/>

  <text class="t s" x="207" y="137" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">第 1 – 37 个</text>
  <text class="t s" x="207" y="157" text-anchor="middle" fill="#F1F5F9" font-size="13">只看不定 · 建立 Benchmark</text>

  <text class="t s" x="577" y="137" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">第 38 – 100 个</text>
  <text class="t s" x="577" y="157" text-anchor="middle" fill="#DBEAFE" font-size="13">决策区 · 超过 Benchmark 立刻出手</text>

  <!-- divider -->
  <line x1="344" y1="100" x2="344" y2="196" stroke="#16233A" stroke-width="3"/>
  <circle cx="344" cy="100" r="7" fill="#16233A"/>
  <text class="t s" x="344" y="92" text-anchor="middle" fill="#16233A" font-size="15" font-weight="700">37%</text>

  <!-- winner marker（放在决策区内侧，避开分段文字） -->
  <line x1="700" y1="104" x2="700" y2="178" stroke="#059669" stroke-width="3"/>
  <path d="M700 96 L708 112 L692 112 Z" fill="#059669"/>
  <text class="t s" x="700" y="212" text-anchor="middle" fill="#047857" font-size="14" font-weight="700">最优解出现 → 立刻出手</text>

  <!-- ticks -->
  <g fill="#94A3B8" font-size="11" font-family="sans-serif">
    <text x="70" y="196" text-anchor="middle">0</text>
    <text x="810" y="196" text-anchor="middle">100</text>
  </g>

  <!-- two failure boxes -->
  <rect x="70" y="248" width="360" height="110" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text class="t b" x="98" y="280" fill="#991B1B" font-size="17">❌ 盲定</text>
  <text class="t s" x="98" y="306">第 1 套 / 第 1 个 offer 就下手</text>
  <text class="t s" x="98" y="328">根因：参照系缺失，被局部最优骗</text>
  <text class="t s" x="98" y="350" fill="#B91C1C">还没见过「好」，怎么认得出「最好」？</text>

  <rect x="450" y="248" width="360" height="110" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text class="t b" x="478" y="280" fill="#92400E" font-size="17">❌ 瘫痪</text>
  <text class="t s" x="478" y="306">看满 100 套还是不定</text>
  <text class="t s" x="478" y="328">根因：沉没成本谬误 + 选择过载</text>
  <text class="t s" x="478" y="350" fill="#B45309">最优解早在第 43 个就过去了。</text>

  <text class="t s" x="450" y="392" text-anchor="middle" fill="#94A3B8" font-size="13">1/e ≈ 0.368 —— 经典最优停止问题（Secretary Problem）的渐近解</text>
  <text class="t s" x="450" y="412" text-anchor="middle" fill="#94A3B8" font-size="13">python3 scripts/sunxue.py 37</text>
</svg>
